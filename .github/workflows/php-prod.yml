name: Build & deploy prod

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # clever deploy pousse l'historique git vers Clever Cloud
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'

    - name: Check if composer.json exists
      id: check_files
      uses: andstor/file-existence-action@v1
      with:
        files: 'composer.json'

    - name: Run composer install if composer.json exists
      if: steps.check_files.outputs.files_exists == 'true'
      run: composer validate --no-check-publish && composer install --prefer-dist --no-progress

    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

    - name: npm install
      run: |
        npm install

    - name: Run PHPUnit tests
      run: ./vendor/bin/phpunit --testdox

    - name: Install Clever Tools
      run: npm install -g clever-tools@5.3.0

    # Variables d'environnement gérées dans Clever Cloud, migrations lancées par CC_PRE_RUN_HOOK
    - name: Deploy to Clever Cloud
      env:
        CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
        CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
      run: clever deploy --alias prod --force --same-commit-policy rebuild
