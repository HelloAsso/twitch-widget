name: Sync Clever Cloud env

# Recopie les secrets GitHub (SANDBOX_* / PROD_*) dans les variables d'environnement
# de l'app Clever Cloud : develop -> ha-stream-sandbox, main -> ha-stream-prod.
# L'app n'est redémarrée que si une valeur a changé.
on:
  push:
    branches: [ "develop", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clever-env-sync-${{ github.ref_name }}

jobs:
  sync:
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

    - name: Install Clever Tools
      run: npm install -g clever-tools@5.3.0

    - name: Sync env variables
      env:
        CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
        CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
        CLEVER_ALIAS: ${{ github.ref_name == 'main' && 'prod' || 'sandbox' }}
        SYNC_API_KEY: ${{ github.ref_name == 'main' && secrets.PROD_API_KEY || secrets.SANDBOX_API_KEY }}
        SYNC_BLOB_CONNECTION_STRING: ${{ github.ref_name == 'main' && secrets.PROD_BLOB_CONNECTION_STRING || secrets.SANDBOX_BLOB_CONNECTION_STRING }}
        SYNC_BREVO_API_KEY: ${{ github.ref_name == 'main' && secrets.PROD_BREVO_API_KEY || secrets.SANDBOX_BREVO_API_KEY }}
        SYNC_CLIENT_ID: ${{ github.ref_name == 'main' && secrets.PROD_CLIENT_ID || secrets.SANDBOX_CLIENT_ID }}
        SYNC_CLIENT_SECRET: ${{ github.ref_name == 'main' && secrets.PROD_CLIENT_SECRET || secrets.SANDBOX_CLIENT_SECRET }}
        SYNC_MANDRILL_API: ${{ github.ref_name == 'main' && secrets.PROD_MANDRILL_API || secrets.SANDBOX_MANDRILL_API }}
      shell: python
      run: |
        import json, os, subprocess

        alias = os.environ["CLEVER_ALIAS"]
        current = json.loads(subprocess.run(
            ["clever", "env", "--alias", alias, "--format", "json"],
            check=True, capture_output=True, text=True,
        ).stdout)
        current = {e["name"]: e["value"] for e in current["env"]}

        changed = []
        for key, value in os.environ.items():
            name = key.removeprefix("SYNC_")
            # Un secret absent côté GitHub ne vide pas la variable côté Clever
            if name == key or not value or current.get(name) == value:
                continue
            subprocess.run(["clever", "env", "set", name, value, "--alias", alias],
                           check=True, capture_output=True)
            changed.append(name)

        if changed:
            print(f"Updated on {alias}: {', '.join(sorted(changed))}")
            subprocess.run(["clever", "restart", "--alias", alias, "--commit", os.environ["GITHUB_SHA"], "--quiet"],
                           check=True)
        else:
            print(f"Nothing to update on {alias}")
